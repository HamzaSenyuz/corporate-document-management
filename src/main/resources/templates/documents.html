<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dokümanlar</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #ecf0f1; }
        .btn { display: inline-block; padding: 10px 20px; background: #27ae60; color: white;
               text-decoration: none; border-radius: 4px; margin-right: 8px; }
        .btn-orange { background: #f39c12; }
        .btn-purple { background: #8e44ad; }
        .btn-gray { background: #7f8c8d; }
        .empty { color: #7f8c8d; margin-top: 20px; }
        a { color: #3498db; }
        .topbar { display: flex; justify-content: space-between; align-items: center;
                  background: #ecf0f1; padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; }
        .topbar form { margin: 0; }
        .logout { background: #e74c3c; color: white; border: none; padding: 7px 14px;
                  border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="topbar">
    <span>
        <strong sec:authentication="name">kullanıcı</strong>
        <span sec:authorize="hasRole('MANAGER')"> — Yönetici</span>
        <span sec:authorize="hasRole('EMPLOYEE')"> — Çalışan</span>
    </span>
    <form method="post" th:action="@{/logout}">
        <button class="logout" type="submit">Çıkış</button>
    </form>
</div>

<div th:if="${error}" style="background:#fadbd8; color:#c0392b; padding:12px 16px;
     border-radius:6px; margin-bottom:16px;" th:text="${error}"></div>

<h1>Dokümanlar</h1>

<a class="btn" href="/documents/upload">+ Yeni Doküman</a>
<a class="btn btn-orange" href="/approvals" sec:authorize="hasRole('MANAGER')">Onay Bekleyenler</a>
<a class="btn btn-purple" href="/activity">Hareket Geçmişi</a>
<a class="btn btn-gray" href="/documents/archived">Arşiv</a>

<table th:if="${!documents.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Başlık</th>
        <th>Kategori</th>
        <th>Yükleyen</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doc : ${documents}">
        <td th:text="${doc.id}"></td>
        <td><a th:href="@{'/documents/' + ${doc.id}}" th:text="${doc.title}"></a></td>
        <td th:text="${doc.category}"></td>
        <td th:text="${doc.createdBy.name}"></td>
    </tr>
    </tbody>
</table>

<p class="empty" th:if="${documents.isEmpty()}">
    Henüz doküman yok. Yukarıdaki butondan ilk dokümanını yükle.
</p>

</body>
</html>
