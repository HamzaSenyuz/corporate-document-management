<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dokümanlar — Doküman Yönetimi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <h1>Dokümanlar</h1>
    <p class="page-sub">Sistemdeki aktif dokümanlar</p>

    <div class="toolbar">
        <a class="btn" href="/documents/upload">+ Yeni Doküman</a>
    </div>

    <div class="card tight" th:if="${!documents.isEmpty()}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:60px;">ID</th>
                    <th>Başlık</th>
                    <th style="width:150px;">Kategori</th>
                    <th style="width:180px;">Yükleyen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doc : ${documents}">
                    <td th:text="${doc.id}"></td>
                    <td><a th:href="@{'/documents/' + ${doc.id}}" th:text="${doc.title}"></a></td>
                    <td th:text="${doc.category}"></td>
                    <td th:text="${doc.createdBy.name}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card" th:if="${documents.isEmpty()}">
        <p class="empty">Henüz doküman yok. "+ Yeni Doküman" ile ilk dokümanını yükle.</p>
    </div>

</main>

</body>
</html>
