<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sistem Hareketleri</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
    h1 { color: #2c3e50; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #ecf0f1; }
    a { color: #3498db; }
  </style>
</head>
<body>

<a href="/documents">← Doküman listesi</a>

<h1>Sistem Hareketleri</h1>

<table th:if="${!logs.isEmpty()}">
  <thead>
  <tr>
    <th>Tarih</th>
    <th>Kullanıcı</th>
    <th>Doküman</th>
    <th>İşlem</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="log : ${logs}">
    <td th:text="${log.formattedDate}"></td>
    <td th:text="${log.user.name}"></td>
    <td>
      <a th:if="${log.document != null}"
         th:href="@{'/documents/' + ${log.document.id}}"
         th:text="${log.document.title}"></a>
    </td>
    <td th:text="${log.description}"></td>
  </tr>
  </tbody>
</table>
<p th:if="${logs.isEmpty()}">Henüz hareket yok.</p>

</body>
</html>
