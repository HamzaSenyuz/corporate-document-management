<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sistem Hareketleri — Doküman Yönetimi</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
  <h1>Sistem Hareketleri</h1>
  <p class="page-sub">Son 50 işlem</p>

  <div class="card tight" th:if="${!logs.isEmpty()}">
    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th style="width:150px;">Tarih</th>
          <th style="width:170px;">Kullanıcı</th>
          <th style="width:180px;">Doküman</th>
          <th>İşlem</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
          <td th:text="${log.formattedDate}"></td>
          <td th:text="${log.user.name}"></td>
          <td>
            <a th:if="${log.document != null}"
               th:href="@{'/documents/' + ${log.document.id}}"
               th:text="${log.document.title}"></a>
            <span th:if="${log.document == null}" style="color:var(--text-muted);">—</span>
          </td>
          <td th:text="${log.description}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" th:if="${logs.isEmpty()}">
    <p class="empty">Henüz hareket yok.</p>
  </div>

</main>

</body>
</html>
