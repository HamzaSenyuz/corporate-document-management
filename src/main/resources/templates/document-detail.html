<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doküman Detayı — Doküman Yönetimi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <a class="back-link" href="/documents">← Doküman listesi</a>

    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
        <div>
            <h1 th:text="${document.title}">Başlık</h1>
            <p class="page-sub" style="margin-bottom:0;" th:text="${document.category}">Kategori</p>
        </div>
        <form method="post" th:if="${!document.archived}"
              th:action="@{'/documents/' + ${document.id} + '/archive'}"
              onsubmit="return confirm('Bu doküman arşive taşınacak. Devam?');">
            <button class="btn btn-ghost" type="submit">Arşivle</button>
        </form>
    </div>

    <div class="card">
        <dl class="info-grid">
            <dt>Açıklama</dt><dd th:text="${document.description}">—</dd>
            <dt>Yükleyen</dt><dd th:text="${document.createdBy.name}">—</dd>
            <dt>Kategori</dt><dd th:text="${document.category}">—</dd>
        </dl>
    </div>

    <h2>Versiyonlar</h2>
    <div class="card tight">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:80px;">Versiyon</th>
                    <th>Dosya</th>
                    <th style="width:150px;">Durum</th>
                    <th style="width:220px;">İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${versions}">
                    <td th:text="'V' + ${v.versionNumber}"></td>
                    <td>
                        <a th:href="@{'/documents/versions/' + ${v.id} + '/download'}"
                           th:text="${v.originalFileName}"></a>
                    </td>
                    <td>
                            <span class="badge" th:classappend="${v.status.name()}"
                                  th:text="${v.status}"></span>
                    </td>
                    <td>
                        <form class="inline-form" th:if="${v.status.name() == 'DRAFT'}" method="post"
                              th:action="@{'/documents/' + ${document.id} + '/versions/' + ${v.id} + '/submit'}">
                            <button class="btn btn-warning btn-sm" type="submit">Onaya Gönder</button>
                        </form>
                        <form class="inline-form" th:if="${v.status.name() == 'DRAFT'}" method="post"
                              th:action="@{'/documents/' + ${document.id} + '/versions/' + ${v.id} + '/delete'}"
                              onsubmit="return confirm('Bu versiyon silinecek. Emin misin?');">
                            <button class="btn btn-danger btn-sm" type="submit">Sil</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2>Onay Geçmişi</h2>
    <div class="card tight" th:if="${!approvals.isEmpty()}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:80px;">Versiyon</th>
                    <th style="width:120px;">Karar</th>
                    <th>Yorum</th>
                    <th style="width:180px;">Değerlendiren</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${approvals}">
                    <td th:text="'V' + ${a.version.versionNumber}"></td>
                    <td>
                            <span class="badge" th:classappend="${a.decision.name()}"
                                  th:text="${a.decision}"></span>
                    </td>
                    <td th:text="${a.comment}"></td>
                    <td th:text="${a.reviewedBy.name}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card" th:if="${approvals.isEmpty()}">
        <p class="empty">Henüz bir karar verilmemiş.</p>
    </div>

    <h2>Hareket Geçmişi</h2>
    <div class="card tight" th:if="${!logs.isEmpty()}">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:150px;">Tarih</th>
                    <th style="width:180px;">Kullanıcı</th>
                    <th>İşlem</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.formattedDate}"></td>
                    <td th:text="${log.user.name}"></td>
                    <td th:text="${log.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2>Yeni Versiyon Yükle</h2>
    <div class="card" style="max-width:560px;">
        <form method="post" enctype="multipart/form-data"
              th:action="@{'/documents/' + ${document.id} + '/versions'}">
            <label>Dosya</label>
            <input type="file" name="file" required>
            <button class="btn" type="submit" style="margin-top:18px;">Yükle</button>
        </form>
    </div>

</main>

</body>
</html>
