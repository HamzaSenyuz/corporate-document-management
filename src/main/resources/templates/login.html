<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giriş — Doküman Yönetimi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-wrap">
    <div class="card login-card">
        <div class="login-head">
            <div class="logo-big">📄</div>
            <h1>Doküman Yönetimi</h1>
            <p class="page-sub" style="margin-bottom:0;">Devam etmek için giriş yapın</p>
        </div>

        <div class="alert alert-error" th:if="${param.error}">E-posta veya şifre hatalı.</div>
        <div class="alert alert-success" th:if="${param.logout}">Çıkış yapıldı.</div>

        <form method="post" th:action="@{/login}">
            <label>E-posta</label>
            <input type="email" name="username" required autofocus>

            <label>Şifre</label>
            <input type="password" name="password" required>

            <button class="btn" type="submit" style="width:100%; justify-content:center; margin-top:22px;">
                Giriş Yap
            </button>
        </form>

        <div class="login-hint">
            <strong>Test hesapları</strong><br>
            employee@test.com / 1234 — Çalışan<br>
            manager@test.com / 1234 — Yönetici
        </div>
    </div>
</div>

</body>
</html>
