<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Doküman — Doküman Yönetimi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <a class="back-link" href="/documents">← Doküman listesi</a>

    <h1>Yeni Doküman</h1>
    <p class="page-sub">Bir dosya yükleyin; ilk versiyon (V1) otomatik oluşturulur.</p>

    <div class="card" style="max-width:560px;">
        <form method="post" th:action="@{/documents/upload}" enctype="multipart/form-data">
            <label>Başlık</label>
            <input type="text" name="title" required>

            <label>Açıklama</label>
            <textarea name="description" rows="3"></textarea>

            <label>Kategori</label>
            <select name="category" required>
                <option value="Sözleşme">Sözleşme</option>
                <option value="Fatura">Fatura</option>
                <option value="Rapor">Rapor</option>
                <option value="Diğer">Diğer</option>
            </select>

            <label>Dosya</label>
            <input type="file" name="file" required>

            <button class="btn" type="submit" style="margin-top:22px;">Yükle</button>
        </form>
    </div>
</main>

</body>
</html>
