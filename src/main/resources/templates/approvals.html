<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Onay Bekleyenler — Doküman Yönetimi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
    <h1>Onay Bekleyen Dokümanlar</h1>
    <p class="page-sub">İncelemeniz için gönderilen versiyonlar</p>

    <div class="card" th:if="${versions.isEmpty()}">
        <p class="empty">Onay bekleyen doküman yok.</p>
    </div>

    <div class="card" th:each="v : ${versions}">
        <h3 th:text="${v.document.title} + '  ·  V' + ${v.versionNumber}"></h3>
        <dl class="info-grid" style="margin:12px 0 16px;">
            <dt>Kategori</dt><dd th:text="${v.document.category}"></dd>
            <dt>Dosya</dt>
            <dd>
                <a th:href="@{'/documents/versions/' + ${v.id} + '/download'}"
                   th:text="${v.originalFileName}"></a>
            </dd>
            <dt>Yükleyen</dt><dd th:text="${v.createdBy.name}"></dd>
        </dl>

        <form method="post" th:action="@{'/approvals/' + ${v.id}}">
            <input type="text" name="comment" placeholder="Yorum (reddediyorsanız gerekçe yazın)">
            <div style="display:flex; gap:10px; margin-top:14px;">
                <button class="btn btn-success" type="submit" name="decision" value="APPROVED">Onayla</button>
                <button class="btn btn-danger"  type="submit" name="decision" value="REJECTED">Reddet</button>
            </div>
        </form>
    </div>

</main>

</body>
</html>
