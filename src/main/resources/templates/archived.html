<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Arşiv — Doküman Yönetimi</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container">
  <h1>Arşiv</h1>
  <p class="page-sub">Arşive taşınmış dokümanlar</p>

  <div class="card tight" th:if="${!documents.isEmpty()}">
    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>Başlık</th>
          <th style="width:140px;">Kategori</th>
          <th style="width:160px;">Yükleyen</th>
          <th style="width:160px;">İşlem</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="doc : ${documents}">
          <td th:text="${doc.id}"></td>
          <td><a th:href="@{'/documents/' + ${doc.id}}" th:text="${doc.title}"></a></td>
          <td th:text="${doc.category}"></td>
          <td th:text="${doc.createdBy.name}"></td>
          <td>
            <form method="post" th:action="@{'/documents/' + ${doc.id} + '/unarchive'}">
              <button class="btn btn-ghost btn-sm" type="submit">Arşivden Çıkar</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" th:if="${documents.isEmpty()}">
    <p class="empty">Arşivde doküman yok.</p>
  </div>

</main>

</body>
</html>
